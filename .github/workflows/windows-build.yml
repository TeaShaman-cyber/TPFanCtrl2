name: Upstream issue 2 isolated acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sha:
          - ea5a3c34c1f000327ed70a2c3c7b68357d1f362a
          - 212bad981558fd5ff1d4a6850798768cc614a7b4
          - ea2b009c1c701a8128b3ed538f885a6926b19d67
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and run available focused tests
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python tests/check_fan_commands.py
          if [ "$EXPECTED_SHA" != ea5a3c34c1f000327ed70a2c3c7b68357d1f362a ]; then
            python tests/check_transport.py
          fi
          if [ "$EXPECTED_SHA" = ea2b009c1c701a8128b3ed538f885a6926b19d67 ]; then
            python tests/check_tach_status.py
          fi
          git diff --exit-code
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sha:
          - ea5a3c34c1f000327ed70a2c3c7b68357d1f362a
          - 212bad981558fd5ff1d4a6850798768cc614a7b4
          - ea2b009c1c701a8128b3ed538f885a6926b19d67
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0ae4893ea16f5664bd6602ccdf8b28c7bf7fba18
          path: tooling
          persist-credentials: false
      - name: Reuse existing x64 build and inventory script
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p tools/ci
          cp ../tooling/tools/ci/build_windows.py tools/ci/
          python tools/ci/build_windows.py
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-issue2-x64-${{ matrix.sha }}
          path: candidate/build-artifact/
          if-no-files-found: error
          retention-days: 7
