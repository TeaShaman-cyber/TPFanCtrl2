name: Upstream issue 2 isolated acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sha:
          - cb1675125dc282312de1a017493c14f63e5bd050
          - e32c9b146ea306721499160e9e16f088e08def6b
          - 39353e58517a7c07e68f40a9eccd85fa1596d701
          - 7d9d529caed8e91e5d368747fc4c9eb796efa84c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and run available focused tests
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python tests/check_fan_commands.py
          if [ "$EXPECTED_SHA" != cb1675125dc282312de1a017493c14f63e5bd050 ]; then
            python tests/check_transport.py
          fi
          if [ "$EXPECTED_SHA" = 39353e58517a7c07e68f40a9eccd85fa1596d701 ] || [ "$EXPECTED_SHA" = 7d9d529caed8e91e5d368747fc4c9eb796efa84c ]; then
            python tests/check_tach_status.py
          fi
          if [ "$EXPECTED_SHA" = 7d9d529caed8e91e5d368747fc4c9eb796efa84c ]; then
            python tests/check_mutex.py
          fi
          git diff --exit-code
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sha:
          - cb1675125dc282312de1a017493c14f63e5bd050
          - e32c9b146ea306721499160e9e16f088e08def6b
          - 39353e58517a7c07e68f40a9eccd85fa1596d701
          - 7d9d529caed8e91e5d368747fc4c9eb796efa84c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 0ae4893ea16f5664bd6602ccdf8b28c7bf7fba18
          path: tooling
          persist-credentials: false
      - name: Reuse existing x64 build and inventory script
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p tools/ci
          cp ../tooling/tools/ci/build_windows.py tools/ci/
          python tools/ci/build_windows.py
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-issue2-x64-${{ matrix.sha }}
          path: candidate/build-artifact/
          if-no-files-found: error
          retention-days: 7
