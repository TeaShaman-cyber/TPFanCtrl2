name: Mull discovery
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'fancontrol/portio.cpp'
      - 'fancontrol/portaccess.cpp'
      - 'tests/check_transport.py'
      - 'tests/mull_transport.py'
      - '.github/workflows/mull-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mull-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned LLVM-compatible Mull
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18
          curl -fsSL --retry 3 -o /tmp/mull.deb https://github.com/mull-project/mull/releases/download/0.39.1/Mull-18-0.39.1-LLVM-18.1.3-ubuntu-amd64-24.04.deb
          echo 'e321b42d481c4b5e0652416dde78b5c02bf34751e5bb2719c8fc00a2b7e68928  /tmp/mull.deb' | sha256sum -c -
          sudo apt-get install -y -qq /tmp/mull.deb
          clang++-18 --version
          mull-runner --version
      - name: Discover transport mutants
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tests/mull_transport.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mull-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
